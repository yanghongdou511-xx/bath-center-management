<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>悦泉洗浴中心 · 综合管理系统</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20260807b" />
</head>
<body>
  <!-- ============ 登录页（深色温泉 · 轻奢高级 spa 风） ============ -->
  <div id="login-view" class="login-view">
    <!-- 背景氛围层 -->
    <div class="lx-bg" aria-hidden="true">
      <div class="lx-glow glow-gold"></div>
      <div class="lx-glow glow-teal"></div>
      <div class="lx-bubbles">
        <span class="bubble b1"></span>
        <span class="bubble b2"></span>
        <span class="bubble b3"></span>
        <span class="bubble b4"></span>
        <span class="bubble b5"></span>
        <span class="bubble b6"></span>
        <span class="bubble b7"></span>
      </div>
      <div class="lx-waves">
        <svg class="wave wave1" viewBox="0 0 1440 120" preserveAspectRatio="none"><path d="M0,60 C240,120 480,0 720,60 C960,120 1200,0 1440,60 L1440,120 L0,120 Z"/></svg>
        <svg class="wave wave2" viewBox="0 0 1440 120" preserveAspectRatio="none"><path d="M0,60 C240,120 480,0 720,60 C960,120 1200,0 1440,60 L1440,120 L0,120 Z"/></svg>
      </div>
      <div class="lx-grain"></div>
    </div>

    <!-- 左：品牌氛围区 -->
    <aside class="login-aside">
      <div class="aside-inner">
        <div class="brand-mark">
          <svg class="brand-drop" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2.4C12 2.4 4.8 10.6 4.8 15.4a7.2 7.2 0 0 0 14.4 0C19.2 10.6 12 2.4 12 2.4Z"/>
          </svg>
          <span class="brand-name">悦泉洗浴</span>
        </div>

        <div class="aside-hero">
          <p class="aside-eyebrow">PRIVATE SPA · 私享疗愈</p>
          <h1 class="aside-title">于喧嚣之外<br/><span class="aside-accent">邂逅一池清欢</span></h1>
          <p class="aside-desc">温泉水润，金辉静谧。一站式智慧管理，让每一处水波都从容流转。</p>
        </div>

        <ul class="aside-feats">
          <li class="feat">
            <span class="feat-ic">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c4 5 7 8 7 12a7 7 0 0 1-14 0c0-4 3-7 7-12Z"/></svg>
            </span>
            <div class="feat-tx">
              <p class="feat-t">天然温泉疗愈</p>
              <p class="feat-s">恒温矿泉，舒缓身心每一刻</p>
            </div>
          </li>
          <li class="feat">
            <span class="feat-ic">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12a7 7 0 0 1 14 0"/><path d="M12 5v14"/><circle cx="12" cy="12" r="2.4"/></svg>
            </span>
            <div class="feat-tx">
              <p class="feat-t">私人专属空间</p>
              <p class="feat-s">独立包厢，私密度假新体验</p>
            </div>
          </li>
          <li class="feat">
            <span class="feat-ic">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 7 2 7H4s2-2 2-7Z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>
            </span>
            <div class="feat-tx">
              <p class="feat-t">智慧管家服务</p>
              <p class="feat-s">一键预约，全程智能托管</p>
            </div>
          </li>
        </ul>

        <div class="aside-foot">
          <span class="foot-line"></span>
          <span class="foot-text">YUEQUAN · 自 1998 年守护每一次入浴时光</span>
          <span class="foot-line"></span>
        </div>
      </div>
    </aside>

    <!-- 右：登录表单区 -->
    <main class="login-main">
      <div class="login-card">
        <div class="card-glow" aria-hidden="true"></div>
        <div class="card-head">
          <div class="card-logo">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 2.4C12 2.4 4.8 10.6 4.8 15.4a7.2 7.2 0 0 0 14.4 0C19.2 10.6 12 2.4 12 2.4Z"/>
            </svg>
          </div>
          <h2 class="card-title">欢迎归来</h2>
          <p class="card-sub">悦泉洗浴中心 · 智能管理中心</p>
        </div>

        <form id="login-form" class="login-form" autocomplete="off">
          <div class="field">
            <label class="field-label" for="login-user">账号</label>
            <div class="field-control">
              <svg class="field-ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.8"/><path d="M5 20c0-3.6 3.1-6.5 7-6.5s7 2.9 7 6.5"/></svg>
              <input id="login-user" class="input" type="text" value="24031532" placeholder="请输入账号" />
            </div>
          </div>

          <div class="field field--pw">
            <label class="field-label" for="login-pass">密码</label>
            <div class="field-control">
              <svg class="field-ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="2.2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
              <input id="login-pass" class="input" type="password" value="123456" placeholder="请输入密码" />
              <button type="button" class="pw-toggle" id="pw-toggle" aria-label="显示或隐藏密码">
                <svg class="ic-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="ic-eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 10.6a3 3 0 0 0 4.2 4.2"/><path d="M9.9 5.3A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a16.8 16.8 0 0 1-3.2 4.1"/><path d="M6.1 6.1A16.8 16.8 0 0 0 2 12s3.6 7 10 7a10.6 10.6 0 0 0 3.5-.6"/></svg>
              </button>
            </div>
          </div>

          <div class="login-row">
            <label class="remember">
              <input type="checkbox" checked /> <span>记住账号</span>
            </label>
            <a class="text-link" href="#">忘记密码？</a>
          </div>

          <button type="submit" class="btn-login">
            <span class="btn-text">登 录</span>
            <span class="btn-shimmer"></span>
          </button>
        </form>

        <div class="card-foot">
          <span class="foot-line"></span>
          <span class="foot-text">端到端加密 · 您的隐私如水般纯净</span>
          <span class="foot-line"></span>
        </div>
      </div>
    </main>
  </div>

  <!-- ============ 主应用 ============ -->
  <div id="app-view" class="app-view hidden">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-badge">💧</span>
        <span class="brand-name">悦泉洗浴</span>
      </div>
      <nav class="menu" id="menu"><!-- 菜单由 app.js 依据 NAV 配置动态生成（细线条图标） --></nav>
    </aside>

    <!-- 主区域 -->
    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button type="button" class="nav-toggle" id="nav-toggle" aria-label="折叠/展开侧边栏">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <span id="page-title" class="page-title">数据概览</span>
        </div>
        <div class="topbar-right">
          <span class="topbar-icon">🔔<span class="dot"></span></span>
          <span class="store-tag" id="current-store">🏬 总店</span>
          <span class="avatar">A</span>
          <span class="user-name">管理员</span>
          <button class="btn btn-text" id="logout-btn">退出</button>
        </div>
      </header>
      <main class="content" id="content"></main>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <!-- 脚本加载失败时的可见错误浮层（用于诊断“点登录无反应”等问题） -->
  <div id="boot-error" class="boot-error hidden"></div>

  <!-- 缓存破坏：每次部署改动 ?v= 后的版本号，强制浏览器拉取最新 JS，避免旧缓存导致登录失效 -->
  <script src="data.js?v=20260807b"></script>
  <script src="app.js?v=20260807b"></script>
  <script>
    // 启动自检：若 app.js 因缓存/语法错误未能执行，则显示明确提示
    window.addEventListener('error', function (e) {
      var box = document.getElementById('boot-error');
      if (box) {
        box.classList.remove('hidden');
        box.innerHTML = '⚠️ 页面脚本加载/执行出错：' + (e.message || '未知错误') +
          '<br><span style="font-size:12px;opacity:.8">多半是浏览器缓存了旧版本，请按 Ctrl+Shift+R 强制刷新；仍不行请清除站点缓存。</span>';
      }
    });
    setTimeout(function () {
      if (!window.__appBooted) {
        var box = document.getElementById('boot-error');
        if (box) {
          box.classList.remove('hidden');
          box.innerHTML = '⚠️ 后台脚本未能启动（app.js 未执行）。' +
            '<br><span style="font-size:12px;opacity:.8">通常是浏览器缓存了旧版本，请按 Ctrl+Shift+R 强制刷新，或清除该站点缓存后重试。</span>';
        }
      }
    }, 2500);
  </script>
</body>
</html>
