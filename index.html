<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>悦泉洗浴中心 · 综合管理系统</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ============ 登录页（沉浸式水疗风格） ============ -->
  <div id="login-view" class="login-view">
    <!-- 动态背景层 -->
    <div class="login-bg-layer">
      <!-- 渐变流光基底 -->
      <div class="login-gradient-base"></div>
      <!-- 水波纹容器 -->
      <div class="login-ripples">
        <div class="ripple r1"></div>
        <div class="ripple r2"></div>
        <div class="ripple r3"></div>
        <div class="ripple r4"></div>
        <div class="ripple r5"></div>
      </div>
      <!-- 浮动粒子/气泡 -->
      <div class="login-particles" id="login-particles"></div>
      <!-- 光晕装饰 -->
      <div class="login-orb orb1"></div>
      <div class="login-orb orb2"></div>
      <div class="login-orb orb3"></div>
    </div>

    <!-- 左：品牌展示区 -->
    <div class="login-left">
      <div class="login-brand"><span class="login-logo">💧</span><span>悦泉洗浴</span></div>
      <h1 class="login-hero">智慧洗浴<br/><span class="hero-accent">一体化管理</span></h1>
      <p class="login-desc">会员、收银、房态、库存、预约、营销——一个后台，全部搞定。</p>
      <ul class="login-feats">
        <li><span class="feat-icon">📊</span>实时经营数据看板</li>
        <li><span class="feat-icon">🏪</span>多门店连锁运营</li>
        <li><span class="feat-icon">💬</span>消息推送与智能提醒</li>
      </ul>
      <div class="login-foot">© 2026 悦泉洗浴中心 · 澜庭水汇</div>
    </div>

    <!-- 右：毛玻璃登录卡片 -->
    <div class="login-right">
      <div class="login-card glass-card">
        <!-- 顶部光带 -->
        <div class="card-glow-bar"></div>
        <!-- 品牌标识 -->
        <div class="login-badge-wrap">
          <div class="login-badge">
            <span class="badge-icon">💧</span>
            <div class="badge-ring"></div>
          </div>
        </div>
        <h1 class="login-title">欢迎登录</h1>
        <p class="login-sub">综合管理系统 · 管理后台</p>

        <form id="login-form" class="login-form">
          <div class="field-group">
            <label class="field-label">账号</label>
            <div class="field field-glass">
              <span class="field-ic">👤</span>
              <input id="login-user" class="input input-glass" type="text" value="24031532" autocomplete="off" placeholder="请输入账号" />
              <span class="field-line"></span>
            </div>
          </div>
          <div class="field-group">
            <label class="field-label">密码</label>
            <div class="field field-glass">
              <span class="field-ic">🔒</span>
              <input id="login-pass" class="input input-glass" type="password" value="123456" placeholder="请输入密码" />
              <span class="field-line"></span>
            </div>
          </div>

          <div class="login-remember">
            <span class="secure-tag">🔐 安全登录 · 数据加密</span>
            <a class="text-link">忘记密码？</a>
          </div>

          <button type="submit" class="btn btn-primary btn-login btn-block">
            <span class="btn-text">登 录</span>
            <span class="btn-shimmer"></span>
          </button>
        </form>

        <!-- 底部装饰线 -->
        <div class="card-bottom-deco">
          <span class="deco-dot"></span>
          <span class="deco-dot"></span>
          <span class="deco-dot active"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 主应用 ============ -->
  <div id="app-view" class="app-view hidden">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-badge">💧</span>
        <span class="brand-name">悦泉洗浴</span>
      </div>
      <nav class="menu" id="menu">
        <a class="menu-item active" data-page="dashboard"><span class="mi-icon">📊</span>数据概览</a>
        <a class="menu-item" data-page="member"><span class="mi-icon">👤</span>会员管理</a>
        <a class="menu-item" data-page="service"><span class="mi-icon">🧖</span>服务项目</a>
        <a class="menu-item" data-page="cashier"><span class="mi-icon">💰</span>前台收银</a>
        <a class="menu-item" data-page="room"><span class="mi-icon">🚪</span>房间管理</a>
        <a class="menu-item" data-page="inventory"><span class="mi-icon">📦</span>库存管理</a>
        <a class="menu-item" data-page="employee"><span class="mi-icon">👥</span>员工管理</a>
        <a class="menu-item" data-page="technician"><span class="mi-icon">💆</span>技师区</a>
        <a class="menu-item" data-page="reservation"><span class="mi-icon">📅</span>预约管理</a>
        <a class="menu-item" data-page="marketing"><span class="mi-icon">🎁</span>营销活动</a>
        <a class="menu-item" data-page="locker"><span class="mi-icon">🔐</span>寄存管理</a>
        <a class="menu-item" data-page="attendance"><span class="mi-icon">🕒</span>考勤排班</a>
        <a class="menu-item" data-page="review"><span class="mi-icon">⭐</span>客诉评价</a>
        <a class="menu-item" data-page="package"><span class="mi-icon">💳</span>会员卡套餐</a>
        <a class="menu-item" data-page="report"><span class="mi-icon">📈</span>数据报表</a>
        <a class="menu-item" data-page="store"><span class="mi-icon">🏬</span>门店设置</a>
      </nav>
    </aside>

    <!-- 主区域 -->
    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <span id="page-title" class="page-title">数据概览</span>
        </div>
        <div class="topbar-right">
          <span class="topbar-icon">🔔<span class="dot"></span></span>
          <span class="store-tag" id="current-store">🏬 总店</span>
          <span class="avatar">A</span>
          <span class="user-name">管理员</span>
          <button class="btn btn-text" id="logout-btn">退出</button>
        </div>
      </header>
      <main class="content" id="content"></main>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
